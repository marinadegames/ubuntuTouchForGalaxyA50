<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="200" viewBox="0 0 1100 200" role="img" aria-labelledby="title description">
  <title id="title">На свой страх и риск. Автор ответственности не несёт.</title>
  <desc id="description">Установка может повредить телефон и привести к потере данных.</desc>
  <rect x="2" y="2" width="1096" height="196" rx="18" fill="#fff1f1" stroke="#d1242f" stroke-width="4"/>
  <g fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <text x="550" y="83" font-size="54">НА СВОЙ СТРАХ И РИСК!</text>
    <text x="550" y="145" font-size="38">АВТОР ОТВЕТСТВЕННОСТИ НЕ НЕСЁТ</text>
  </g>
</svg>
